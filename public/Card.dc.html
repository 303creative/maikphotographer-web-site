<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The303 — Digital Card</title>
<meta name="description" content="The303 / Maikel Marshall — Miami. Book, call, save contact.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://www.maikphotographer.com/Card.dc.html">
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" href="/favicon.ico">
<meta property="og:title" content="The303 — Digital Card">
<meta property="og:description" content="The303 / Maikel Marshall — Miami. Book, call, save contact.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.maikphotographer.com/Card.dc.html">
<meta property="og:image" content="https://www.maikphotographer.com/assets/backgrounds/31_fondo_ia1_oscuro_principal.jpg">
<meta name="twitter:card" content="summary_large_image">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,300..800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0A0A0A;color:#F2F2F0;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
a{color:#F2F2F0;text-decoration:none}
a:hover{color:#FF5A36}
</style>
</helmet>
<div data-screen-label="NFC Card" style="font-family:'Archivo',sans-serif;background:#0A0A0A;color:#F2F2F0;min-height:100vh;position:relative;overflow-x:hidden;padding:20px 16px 96px;max-width:520px;margin:0 auto;container-type:inline-size;display:flex;flex-direction:column;gap:20px">
  <div style="position:absolute;inset:0;pointer-events:none;margin:0 16px;background-image:linear-gradient(90deg,rgba(242,242,240,.06) 1px,transparent 1px);background-size:25% 100%;border-right:1px solid rgba(242,242,240,.06)"></div>
  <div style="position:absolute;top:-10%;right:-30%;width:90%;aspect-ratio:1;background:radial-gradient(closest-side,rgba(255,90,54,.3),rgba(255,90,54,0));filter:blur(30px);pointer-events:none"></div>

  <div style="position:relative;display:flex;justify-content:space-between;align-items:center">
    <span style="font-weight:800;font-stretch:115%;font-size:18px;letter-spacing:-.02em">THE303</span>
    <div style="display:flex;border:1px solid rgba(242,242,240,.25);font-family:'IBM Plex Mono',monospace;font-size:10px">
      <button onClick="{{ setEn }}" style="{{ enStyle }}">EN</button>
      <button onClick="{{ setEs }}" style="{{ esStyle }}">ES</button>
    </div>
  </div>

  <div style="position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))">
    <div style="grid-column:1 / span 2;position:relative;aspect-ratio:1;overflow:hidden;background:#161616">
      <img src="https://www.maikphotographer.com/assets/portfolio/about_profile.jpg?v=7" alt="Maikel Marshall" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(1.05) contrast(1.03)">
    </div>
    <div style="grid-column:3 / span 2;padding-left:12px;display:flex;flex-direction:column;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#8A8A87">
      <span>NFC · ID 303</span>
      <span>25.7617° N<br>80.1918° W</span>
      <span style="height:32px;background:repeating-linear-gradient(90deg,#F2F2F0 0 1px,transparent 1px 3px,#F2F2F0 3px 5px,transparent 5px 6px,#F2F2F0 6px 7px,transparent 7px 10px)"></span>
    </div>
  </div>

  <div style="position:relative">
    <h1 style="margin:0;font-weight:600;font-stretch:112%;font-size:clamp(44px,15cqw,80px);line-height:.86;letter-spacing:-.045em;text-transform:uppercase">Maikel<br><span style="color:#5C5C5A">Marshall</span></h1>
    <div style="margin-top:12px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase">{{ t.role }}</div>
  </div>

  <a href="{{ vcard }}" download="Maikel-Marshall.vcf" style="position:relative;display:flex;justify-content:space-between;align-items:center;height:60px;padding:0 18px;background:#F2F2F0;color:#0A0A0A;font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.02em" style-hover="background:#FF5A36;color:#0A0A0A"><span>{{ t.save }}</span><span>↓</span></a>

  <div style="position:relative;border-top:1px solid rgba(242,242,240,.3)">
    <sc-for list="{{ links }}" as="l" hint-placeholder-count="6">
      <a href="{{ l.href }}" style="display:grid;grid-template-columns:44px 1fr auto;align-items:center;min-height:64px;border-bottom:1px solid rgba(242,242,240,.3)">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:#8A8A87">[{{ l.n }}]</span>
        <span style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-weight:500;font-size:19px;text-transform:uppercase;letter-spacing:-.01em">{{ l.label }}</span><span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:#8A8A87;overflow-wrap:anywhere">{{ l.value }}</span></span>
        <span style="font-size:20px">↗</span>
      </a>
    </sc-for>
  </div>

  <div style="position:relative;display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#8A8A87"><span>© 2026 The303</span><span>Miami, FL</span></div>
</div>
<dc-import name="SiteFooter" lang="{{ lang }}" compact="{{ true }}" audit-href="Contact.dc.html#audit" hint-size="100%,1px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;es&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;'en'|'es'&quot;}}">
const T = {
  en:{role:'Founder · The303 content & brand studio',save:'Save contact',l:['WhatsApp','Email','Instagram','Website','Free audit','Book a call']},
  es:{role:'Fundador · The303 estudio de contenido y marca',save:'Guardar contacto',l:['WhatsApp','Email','Instagram','Web','Auditoría gratis','Reservar llamada']}
};
const VCF = 'BEGIN:VCARD\nVERSION:3.0\nFN:Maikel Marshall\nORG:The303\nTITLE:Founder / Creative Director\nTEL;TYPE=CELL:+17863329815\nEMAIL:maikelmarshall07@gmail.com\nURL:https://www.maikphotographer.com\nADR:;;;Miami;FL;;USA\nEND:VCARD';
class Component extends DCLogic {
  state = { lang: (()=>{try{return localStorage.getItem('t303-lang')}catch(e){return null}})() };
  setLang = l => { try{localStorage.setItem('t303-lang',l)}catch(e){} this.setState({lang:l}); };
  renderVals() {
    const lang = this.state.lang ?? this.props.lang ?? 'en';
    const t = T[lang];
    const pill = a => ({background: a ? '#F2F2F0' : 'transparent', color: a ? '#0A0A0A' : '#8A8A87', border:0, padding:'0 9px', height:30, cursor:'pointer', fontFamily:'inherit', fontSize:10});
    const vals = [['+1 786 332 9815','https://wa.me/17863329815'],['maikelmarshall07@gmail.com','mailto:maikelmarshall07@gmail.com'],['@maik_photographer','https://www.instagram.com/maik_photographer/'],['maikphotographer.com','./'],['$0 · 3 recommendations','Contact.dc.html#audit'],['30 min','Contact.dc.html']];
    return { t, lang, setEn: () => this.setLang('en'), setEs: () => this.setLang('es'), enStyle: pill(lang==='en'), esStyle: pill(lang==='es'),
      vcard: 'data:text/vcard;charset=utf-8,' + encodeURIComponent(VCF),
      links: t.l.map((label,i) => ({label, value: vals[i][0], href: vals[i][1], n:'0'+(i+1)})) };
  }
}
</script>
<script type="module" src="/js/mariela-widget.js"></script>
</body>
</html>
