<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="font-family:'Archivo',sans-serif;color:#F2F2F0">
<sc-if value="{{ full }}" hint-placeholder-val="{{ true }}">
<footer style="position:relative;z-index:1;padding:88px clamp(16px,3vw,48px) 24px;overflow:hidden;container-type:inline-size">
  <div style="position:absolute;bottom:-30%;left:-20%;width:70%;aspect-ratio:1;background:radial-gradient(closest-side,rgba(255,90,54,.32),rgba(255,90,54,0));filter:blur(30px);pointer-events:none"></div>
  <a href="{{ auditHref }}" style="position:relative;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 0;border-top:1px solid rgba(242,242,240,.3);border-bottom:1px solid rgba(242,242,240,.3);color:#F2F2F0;text-decoration:none" style-hover="color:#FF5A36">
    <span style="font-weight:600;font-stretch:112%;font-size:clamp(28px,7cqw,96px);line-height:.9;letter-spacing:-.04em;text-transform:uppercase">{{ t.cta }}</span>
    <span style="font-size:clamp(28px,6cqw,80px);font-weight:300">↗</span>
  </a>
  <div style="position:relative;font-weight:800;font-stretch:125%;font-size:20.5cqw;line-height:.8;letter-spacing:-.06em;white-space:nowrap;margin-top:48px">THE303</div>
  <div style="position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:24px 12px;margin-top:32px;padding-top:16px;border-top:1px solid rgba(242,242,240,.3);font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase">
    <div style="display:flex;flex-direction:column;gap:10px">
      <sc-for list="{{ links1 }}" as="l" hint-placeholder-count="4"><a href="{{ l.href }}" style="color:#F2F2F0;text-decoration:none" style-hover="color:#FF5A36">{{ l.label }}</a></sc-for>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <sc-for list="{{ links2 }}" as="l" hint-placeholder-count="4"><a href="{{ l.href }}" style="color:#F2F2F0;text-decoration:none" style-hover="color:#FF5A36">{{ l.label }}</a></sc-for>
    </div>
    <div style="color:#8A8A87;line-height:1.7">25.7617° N<br>80.1918° W<br>Brickell · Coral Gables</div>
    <div style="color:#8A8A87;line-height:1.7">© 2026 The303<br>Maikel Marshall · Miami, FL</div>
  </div>
</footer>
</sc-if>

<sc-if value="{{ chatOpen }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;right:12px;bottom:84px;z-index:70;width:min(calc(100% - 24px),380px);background:#0A0A0A;border:1px solid rgba(242,242,240,.3);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6)">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid rgba(242,242,240,.14)">
      <div style="display:flex;flex-direction:column;gap:4px">
        <span style="font-weight:600;font-stretch:112%;font-size:20px;text-transform:uppercase;letter-spacing:-.02em;line-height:1">Mariela</span>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#8A8A87;display:flex;align-items:center;gap:6px"><span style="width:6px;height:6px;border-radius:50%;background:#FF5A36"></span>{{ t.online }}</span>
      </div>
      <button onClick="{{ closeChat }}" aria-label="Close" style="width:40px;height:40px;background:transparent;border:1px solid rgba(242,242,240,.25);color:#F2F2F0;font-size:18px;cursor:pointer">×</button>
    </div>
    <div style="padding:16px;display:flex;flex-direction:column;gap:10px">
      <div style="align-self:flex-start;max-width:88%;background:#161616;border:1px solid rgba(242,242,240,.1);padding:12px 14px;font-size:14px;line-height:1.45">{{ t.hello }}</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:#5C5C5A;text-transform:uppercase;letter-spacing:.08em">{{ t.pending }}</div>
    </div>
    <div style="display:flex;flex-direction:column;border-top:1px solid rgba(242,242,240,.14)">
      <sc-for list="{{ replies }}" as="r" hint-placeholder-count="3">
        <a href="{{ r.href }}" onClick="{{ closeChat }}" style="display:flex;justify-content:space-between;align-items:center;min-height:52px;padding:0 16px;border-bottom:1px solid rgba(242,242,240,.14);font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#F2F2F0;text-decoration:none" style-hover="background:#F2F2F0;color:#0A0A0A">
          <span>{{ r.label }}</span><span>↗</span>
        </a>
      </sc-for>
    </div>
  </div>
</sc-if>

<button onClick="{{ toggleChat }}" aria-label="Mariela AI" style="position:fixed;right:12px;bottom:84px;z-index:71;width:56px;height:56px;border-radius:50%;background:#FF5A36;color:#0A0A0A;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 8px 30px rgba(255,90,54,.35);font-family:'Archivo',sans-serif">
  <span style="font-weight:800;font-stretch:115%;font-size:18px;line-height:1">{{ fabLabel }}</span>
  <span style="font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.08em">AI</span>
</button>

<div style="position:fixed;bottom:0;left:0;right:0;z-index:65;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(10,10,10,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid rgba(242,242,240,.14);display:grid;grid-template-columns:minmax(0,1fr) 56px;gap:8px">
  <a href="{{ auditHref }}" style="display:flex;justify-content:space-between;align-items:center;height:52px;padding:0 16px;background:#F2F2F0;color:#0A0A0A;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.02em;text-decoration:none" style-hover="background:#FF5A36;color:#0A0A0A"><span>{{ t.bar }}</span><span>↗</span></a>
  <a href="https://wa.me/17863329815" aria-label="WhatsApp" style="height:52px;border:1px solid rgba(242,242,240,.3);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#F2F2F0;text-decoration:none">WA</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;es&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;'en'|'es'&quot;},&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;auditHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Contact.dc.html#audit&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;marielaUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const T = {
  en: { cta:'Get your free audit', bar:'Free audit', online:'AI assistant · online', hello:"Hi, I'm Mariela, The303's assistant. I can answer questions, check packages and book your call. What do you need?", pending:'[ Live widget pending — replies route to WhatsApp ]', r:['Get my free audit','See pricing','Talk on WhatsApp'],
    l1:['Home','About','Systems','Work'], l2:['Pricing','Journal','Contact','@Instagram'] },
  es: { cta:'Pide tu auditoría gratis', bar:'Auditoría gratis', online:'Asistente IA · en línea', hello:'Hola, soy Mariela, la asistente de The303. Puedo responder dudas, explicarte los paquetes y agendar tu llamada. ¿Qué necesitas?', pending:'[ Widget en vivo pendiente — las respuestas van a WhatsApp ]', r:['Quiero mi auditoría gratis','Ver precios','Hablar por WhatsApp'],
    l1:['Inicio','Nosotros','Sistemas','Trabajo'], l2:['Precios','Journal','Contacto','@Instagram'] }
};
const H1 = ['./','About.dc.html','Services.dc.html','Work.dc.html'];
const H2 = ['Pricing.dc.html','Journal.dc.html','Contact.dc.html','https://www.instagram.com/maik_photographer/'];
class Component extends DCLogic {
  state = { chat: false };
  renderVals() {
    const lang = this.props.lang || 'en';
    const t = T[lang];
    const audit = this.props.auditHref || 'Contact.dc.html#audit';
    const wa = 'https://wa.me/17863329815';
    const mUrl = this.props.marielaUrl;
    return {
      t, full: !(this.props.compact ?? false), auditHref: audit, chatOpen: this.state.chat,
      fabLabel: this.state.chat ? '×' : 'M',
      toggleChat: () => { if (mUrl) { window.open(mUrl, '_blank'); return; } this.setState(s => ({chat: !s.chat})); },
      closeChat: () => this.setState({chat:false}),
      replies: [[t.r[0], audit], [t.r[1], 'Pricing.dc.html'], [t.r[2], wa]].map(([label,href]) => ({label, href})),
      links1: t.l1.map((label,i) => ({label, href:H1[i]})),
      links2: t.l2.map((label,i) => ({label, href:H2[i]}))
    };
  }
}
</script>
</body>
</html>
