<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="position:fixed;top:0;left:0;right:0;z-index:60;display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:14px;padding:14px clamp(16px,3vw,48px);background:rgba(10,10,10,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(242,242,240,.14);font-family:'Archivo',sans-serif;color:#F2F2F0">
  <a href="./" aria-label="The303 Creative" style="display:inline-flex;align-items:center;line-height:0;text-decoration:none"><img src="/assets/brand/the303-logo.png" alt="The303 Creative" style="height:42px;width:auto;display:block"></a>
  <div style="font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.08em;color:#8A8A87;line-height:1.3;text-transform:uppercase">25.76°N<br>80.19°W</div>
  <div style="display:flex;border:1px solid rgba(242,242,240,.25);font-family:'IBM Plex Mono',monospace;font-size:10px">
    <button onClick="{{ setEn }}" style="{{ enStyle }}">EN</button>
    <button onClick="{{ setEs }}" style="{{ esStyle }}">ES</button>
  </div>
  <button onClick="{{ toggle }}" aria-label="Menu" style="width:44px;height:44px;border:1px solid rgba(242,242,240,.25);background:transparent;color:#F2F2F0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;padding:0">
    <span style="{{ bar1 }}"></span><span style="{{ bar2 }}"></span>
  </button>
</header>
<sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;top:73px;left:0;right:0;bottom:0;z-index:59;background:#0A0A0A;display:flex;flex-direction:column;padding:8px clamp(16px,3vw,48px) 24px;overflow:auto;font-family:'Archivo',sans-serif;color:#F2F2F0">
    <sc-for list="{{ items }}" as="m" hint-placeholder-count="7">
      <a href="{{ m.href }}" onClick="{{ close }}" style="display:grid;grid-template-columns:52px 1fr auto;align-items:baseline;padding:16px 0;border-bottom:1px solid rgba(242,242,240,.14);color:#F2F2F0;text-decoration:none">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8A8A87">[{{ m.n }}]</span>
        <span style="font-weight:600;font-stretch:112%;font-size:clamp(34px,9vw,72px);line-height:.95;text-transform:uppercase;letter-spacing:-.03em">{{ m.label }}</span>
        <span style="{{ m.markStyle }}">{{ m.mark }}</span>
      </a>
    </sc-for>
    <div style="margin-top:auto;padding-top:32px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;color:#8A8A87;text-transform:uppercase;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><span>Brickell · Coral Gables · Miami</span><span>+1 786 332 9815</span></div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:600},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;es&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;'en'|'es'&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;about&quot;,&quot;services&quot;,&quot;work&quot;,&quot;pricing&quot;,&quot;journal&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onLang&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(l:string)=&gt;void&quot;}}">
const L = {
  en: { home:'Home', about:'About', services:'Systems', work:'Work', pricing:'Pricing', journal:'Journal', contact:'Contact' },
  es: { home:'Inicio', about:'Nosotros', services:'Sistemas', work:'Trabajo', pricing:'Precios', journal:'Journal', contact:'Contacto' }
};
const PAGES = [['home','./'],['about','About.dc.html'],['services','Services.dc.html'],['work','Work.dc.html'],['pricing','Pricing.dc.html'],['journal','Journal.dc.html'],['contact','Contact.dc.html']];
class Component extends DCLogic {
  state = { open: false };
  renderVals() {
    const lang = this.props.lang || 'en';
    const on = this.props.onLang || (() => {});
    const o = this.state.open;
    const pill = a => ({background: a ? '#F2F2F0' : 'transparent', color: a ? '#0A0A0A' : '#8A8A87', border:0, padding:'0 9px', height:30, cursor:'pointer', fontFamily:'inherit', fontSize:10});
    const bar = {display:'block', width:18, height:1, background:'#F2F2F0', transition:'transform .25s'};
    return {
      open: o, toggle: () => this.setState({open:!o}), close: () => this.setState({open:false}),
      setEn: () => on('en'), setEs: () => on('es'), enStyle: pill(lang==='en'), esStyle: pill(lang==='es'),
      bar1: {...bar, transform: o ? 'translateY(3px) rotate(45deg)' : 'none'},
      bar2: {...bar, transform: o ? 'translateY(-3px) rotate(-45deg)' : 'none'},
      items: PAGES.map(([k,href],i) => {
        const a = this.props.active === k;
        return {href, label: L[lang][k], n: '0'+i, mark: a ? '●' : '↗', markStyle:{fontSize: a ? 14 : 22, color: a ? '#FF5A36' : '#F2F2F0'}};
      })
    };
  }
}
</script>
</body>
</html>
